version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: kmgr
    main: main.go
    binary: kmgr
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Les variables de version vivent dans le package cmd (voir Makefile).
    ldflags:
      - -s -w
      - -X github.com/UnPoilTefal/kmgr/cmd.Version={{ .Version }}
      - -X github.com/UnPoilTefal/kmgr/cmd.Commit={{ .ShortCommit }}
      - -X github.com/UnPoilTefal/kmgr/cmd.BuildDate={{ .Date }}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

# ─── Homebrew tap ────────────────────────────────────────────────────────────
# Cask et non formule : GoReleaser a deprecie « brews », Homebrew reservant
# desormais les formules a ce qui se compile depuis les sources.
homebrew_casks:
  - name: kmgr
    binaries: [kmgr]
    repository:
      owner: UnPoilTefal
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
      # Push direct. Le tap n'a pas de pull requests (desactivees) et sa
      # regle « pull_request » a ete retiree du ruleset : elle rendait le
      # depot impossible a ecrire par l'un comme par l'autre chemin.
    homepage: "https://github.com/UnPoilTefal/kmgr"
    description: "Kubeconfig manager — normalize, merge and switch kubeconfigs with a strict naming convention"
    license: "MIT"
    hooks:
      post:
        # Un binaire telecharge est mis en quarantaine par Gatekeeper, ce qui
        # le rend inexecutable sans intervention de l'utilisateur.
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/kmgr"]
          end

# ─── Image de conteneur ──────────────────────────────────────────────────────
# « dockers_v2 » : une seule entree multi-plateforme, plus de manifeste a
# assembler a la main.
dockers_v2:
  - id: kmgr
    images:
      - "ghcr.io/unpoiltefal/kmgr"
    tags:
      - "{{ .Version }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile
    labels:
      org.opencontainers.image.source: "https://github.com/UnPoilTefal/kmgr"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.licenses: "MIT"
